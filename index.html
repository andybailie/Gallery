<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Audio-Visual Gallery (VR, Textures & Background Music)</title>
    <!-- Google Fonts for Museum Plaques & UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-Soft: rgba(212, 175, 55, 0.35);
            --glass-bg: rgba(18, 18, 22, 0.78);
            --glass-border: rgba(255, 255, 255, 0.14);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none; 
            touch-action: none;
            overscroll-behavior: none;
        }

        /* Top-Left Exhibition Header */
        #ui-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #f4f4f6;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 14px 18px;
            border-radius: 14px;
            pointer-events: none;
            line-height: 1.55;
            font-size: 13px;
            z-index: 10;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 290px;
        }
        #ui-overlay .gallery-title {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            display: block;
        }
        .ui-hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        /* Sleek Floating Audio Controller Card */
        #audio-hud {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 335px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-Soft);
            border-radius: 16px;
            padding: 14px 16px;
            color: #fff;
            z-index: 15;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease;
        }
        #audio-hud.playing {
            border-color: var(--gold);
            box-shadow: 0 12px 36px rgba(212, 175, 55, 0.18);
        }
        .hud-top-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Primary Play/Pause Circle Button */
        .play-toggle-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, #d4af37 0%, #9a7b1c 100%);
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.2s;
        }
        .play-toggle-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.55);
        }
        .play-toggle-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .play-toggle-btn:disabled {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.35);
            box-shadow: none;
            cursor: default;
        }
        .play-toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .track-meta {
            flex: 1;
            min-width: 0;
        }
        .track-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gold);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .track-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
            color: #fff;
        }

        /* Animated Equalizer Bars */
        .eq-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #audio-hud.playing .eq-bars {
            opacity: 1;
        }
        .eq-bar {
            width: 2.5px;
            background: var(--gold);
            border-radius: 2px;
            animation: eqBounce 0.8s infinite ease-in-out alternate;
        }
        .eq-bar:nth-child(1) { height: 4px; animation-delay: 0s; }
        .eq-bar:nth-child(2) { height: 9px; animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { height: 6px; animation-delay: 0.4s; }
        .eq-bar:nth-child(4) { height: 10px; animation-delay: 0.1s; }
        @keyframes eqBounce {
            0% { height: 3px; }
            100% { height: 10px; }
        }

        /* Secondary Utility Icon Buttons */
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: var(--gold-Soft);
        }
        .icon-btn.active {
            color: var(--gold);
            border-color: var(--gold-Soft);
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Progress Scrubber Bar */
        .progress-row {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .time-stamp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            font-variant-numeric: tabular-nums;
            min-width: 32px;
        }
        .progress-track {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 99px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f5d78e);
            border-radius: 99px;
            transition: width 0.1s linear;
        }

        /* Collapsible Floor & Ceiling JPG Texture Customizer Panel */
        #texture-panel {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 12px;
        }
        #texture-panel.open {
            display: block;
        }
        .tex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tex-row:last-child {
            margin-bottom: 0;
        }
        .tex-label {
            color: #e0e0e0;
            font-weight: 500;
            min-width: 58px;
        }
        .tex-upload-btn {
            background: rgba(212, 175, 55, 0.16);
            border: 1px solid var(--gold-Soft);
            color: #f5d78e;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .tex-upload-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            border-color: var(--gold);
        }
        .tex-repeat-input {
            width: 75px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .tex-repeat-val {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            min-width: 28px;
            text-align: right;
        }

        /* Upgraded Frosted-Glass D-Pad Controls */
        #mobile-controls {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .control-row {
            display: flex;
            gap: 16px;
        }
        .dir-btn {
            width: 56px;
            height: 56px;
            background: rgba(20, 20, 25, 0.65);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            color: #f5d78e;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            touch-action: manipulation;
            transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .dir-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .dir-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--gold);
        }
        .dir-btn:active {
            transform: scale(0.92);
            background: rgba(212, 175, 55, 0.4);
        }

        @media (max-width: 680px) {
            #audio-hud {
                top: auto;
                bottom: 160px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: calc(100vw - 36px);
                max-width: 345px;
            }
        }

        /* Moves the Three.js VR button to the bottom right */
        #VRButton {
            left: auto !important;
            right: 20px !important;
        }
    </style>
</head>
<body>

    <!-- Top-Left Exhibition Guide -->
    <div id="ui-overlay">
        <span class="gallery-title">Voices of Recovery</span>
        <div class="ui-hint">
            • <strong>Walk:</strong> WASD, Arrows, or D-Pad<br>
            • <strong>Look:</strong> Click & Drag<br>
            • <strong>Audio:</strong> Approach any frame or click the <strong>3D Listen Button</strong> below a plaque
        </div>
    </div>

    <!-- Sleek Audio Player HUD + Texture Customizer -->
    <div id="audio-hud">
        <div class="hud-top-row">
            <button id="btn-play-toggle" class="play-toggle-btn" title="Play / Pause Story" disabled>
                <svg id="icon-play" viewBox="0 0 24 24">
                    <path d="M8 5.14v14l11-7-11-7z"/>
                </svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <div class="track-meta">
                <div class="track-label">
                    <span>Audio Guide</span>
                    <span class="eq-bars">
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                    </span>
                </div>
                <div id="hud-track-title" class="track-title">Walk near an artwork...</div>
            </div>

            <button id="btn-restart" class="icon-btn" title="Restart Story">
                <svg viewBox="0 0 24 24">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>

            <button id="btn-bgm" class="icon-btn active" title="Toggle Ambient Music">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </button>

            <!-- Toggle Floor/Ceiling Texture Picker Panel -->
            <button id="btn-tex-panel" class="icon-btn" title="Change Floor & Ceiling JPG Textures">
                <svg viewBox="0 0 24 24">
                    <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
                </svg>
            </button>
        </div>

        <div class="progress-row">
            <span id="time-current" class="time-stamp">0:00</span>
            <div id="progress-track" class="progress-track" title="Seek Audio">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="time-total" class="time-stamp">0:00</span>
        </div>

        <!-- Live Floor & Ceiling JPG Texture Loader Drawer -->
        <div id="texture-panel">
            <div class="tex-row">
                <span class="tex-label">Floor</span>
                <label class="tex-upload-btn" for="input-floor-jpg">Choose .JPG</label>
                <input type="file" id="input-floor-jpg" accept=".jpg,.jpeg,image/jpeg,image/png" style="display:none;">
                <input type="range" id="slider-floor-repeat" class="tex-repeat-input" min="1" max="24" value="10" title="Floor Tile Repeat">
                <span id="val-floor-repeat" class="tex-repeat-val">10x</span>
            </div>
            <div class="tex-row">
                <span class="tex-label">Ceiling</span>
                <label class="tex-upload-btn" for="input-ceiling-jpg">Choose .JPG</label>
                <input type="file" id="input-ceiling-jpg" accept=".jpg,.jpeg,image/jpeg,image/png" style="display:none;">
                <input type="range" id="slider-ceiling-repeat" class="tex-repeat-input" min="1" max="24" value="8" title="Ceiling Tile Repeat">
                <span id="val-ceiling-repeat" class="tex-repeat-val">8x</span>
            </div>
        </div>
    </div>

    <!-- Upgraded Vector SVG On-Screen D-Pad -->
    <div id="mobile-controls">
        <div class="dir-btn" id="btn-up" title="Move Forward">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </div>
        <div class="control-row">
            <div class="dir-btn" id="btn-left" title="Turn Left">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </div>
            <div class="dir-btn" id="btn-down" title="Move Backward">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="dir-btn" id="btn-right" title="Turn Right">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // ==========================================
        // 0. ROOM SURFACE JPG TEXTURE CONFIGURATION
        // ==========================================
        // Change any of these file paths to point to your own .jpg files!
        const ROOM_TEXTURES = {
            wallJpg:    'images/wall.jpg',
            wallRepeat: { x: 8, y: 2 },

            floorJpg:    'images/floor.jpg',
            floorRepeat: { x: 10, y: 10 },

            ceilingJpg:    'images/ceiling.jpg',
            ceilingRepeat: { x: 8, y: 8 }
        };

        // ==========================================
        // 1. GALLERY DATA CONFIGURATION
        // ==========================================
        const galleryItems = [
            {image: "images/Tracks.jpg", 
                text: "Conversations with My Addiction\n\nYou might have thought you’ve won by taking everything from me. But not today.\n\nToday I chose to build back stronger. So I take back my power.\n\nYou thought you had me cornered and isolated. You thought you had me so messed up inside and weak.\n\nBut I chose to go within and confront my traumas one by one.\n\nThe constant negative words whispered in my ear, “you’re not good enough”, “you’re a disgrace”, “no one will want you again”.\n\nToday I chose to be my own best friend and give myself some self-care and love. From this I can flourish. I am worthy of a lot more.\n\nI was only as sick as my secrets. Today they got outed.\n\nNo more manipulation, ducking and diving and lies.\n\nToday I only speak the truth and if you don’t like that then you are not welcome here.\n\nToday I found me.\n\nToday I speak to people that can suggest another approach to life.\n\nToday I can sort through my thoughts and know what is real and what is not.\n\nToday I choose not to wallow in self-pity.\n\nI choose life over death.\n\nI choose freedom over jails or institutions.", 
                audio: "audio/conversations.m4a" },
            { image: "images/Roots.jpg",
             text: "Lend Me Your Ears\n\nMost of my adult life so far has been the best of times and also the worst of times. Living in a bubble, carefree, un-ambitious, uninspired, day-to-day existing, time sapping, a draining path where alcohol came first. I had a cavalier mind about it – putting alcohol before my family relations, mental health, physical health, safety and shelter.\n\nI grew up with addiction in my family, I seen it young but never thought that it would affect my life. Soon I realised that I was repeating the behaviour and becoming even worse.\n\nI didn’t care if I was living in a room or in a bedsit with no windows, as long as I could jam the door locked. It was like I’d rather be nowhere else at times. I thought ‘this is the best I can be today and that is good enough\". Living in the pools you forget about the sea. Drinking became something I just didn’t look forward to anymore - more like something I needed. I became controlled by it and life became unmanageable. My self-care, well-being, functionality, all withered away.\n\nMy drinking went beyond social drinking – drink before, drink during and drink after. I was highly strung, irritable and agitated. What you are not changing, you are choosing and sometimes repeated mistakes become a choice. I thought I could control my drinking. Truth is, I couldn’t. I tried managing it, negotiating with it, outsmarting it but I always lost.\n\nSobriety didn’t truly start for me until I finally realised I had to walk away. Being sober is the choice to stop the behaviour that leads there.\n\nSober isn’t boring;\nSober is remembering every laugh;\nSober is waking up without guilt;\nSober is building the life you were scared to dream about;\nMy changes haven’t always been permanent but the change I want is.",
             audio: "audio/lend ears.m4a" },
            { image: "images/Rain.jpg",
             text: "The Rain\n\nIf in the morning I do not wake it was because of all my pain;\nI hope and wished for brighter days but all I got was the rain.\n\n\nI tried so hard to push through the pain hoping the rain would clear;\npraying for a little bit of sunshine and those brighter days to reappear.\n\n\nAs the days turned to weeks and then into months and the sun still didn’t show, I believed in my heart it was then my time to go.\n\n\nI wanted to stay for longer, to one day make everyone proud; it’s just no matter how hard I try, I can’t outrun this constant dark cloud.\n\n\nI hope one day you can understand it was because of all my pain; my only wish is that I could have been stronger than the rain.",
             audio: "audio/the rain.m4a" },
            { image: "images/Time.jpg", 
             text: "Wednesdays\n\nFriday Wee treat, sweet.\nI’ve earned it… Entitled\nSaturday, feel like shit.\n\nWednesday - no confession.\nFriday… Groundhog Day,\nSaturday, take the edge off.\n\nWednesday… No confession\nBuying bulk, prudence\nFriday, weekend bender.\n\nMonday, take the edge off, functional;\nWednesday, no confession\nBulk again, makes sense\nWatch the pounds, and the pence\nThursday to Sunday foot to the floor.\n\nCan’t work Monday, body sore\nTuesday, take the edge off\nWednesday, I’m beat.\n\nI realised once I used on Wednesdays I had a problem;\nWeekends start earlier, finish later\nNot my fault, become a hater.\n\nWednesday\nMy confession\nHalf truths, denial, blind to progression\nManipulation, control\nTotal obsession.",
             audio: "audio/wednesdays.m4a" },
            { image: "images/Frontdoor.jpg",
             text: "It’s An Inside Job\n\nWe look around and see pain and hurt;\nWe internalise and feel like a piece of dirt.\nWe are only drinking alcohol and doing no harm;\nuntil one day the body sounds the alarm.\nIt’s either jail or hospital or maybe even your last breath;\nThis is real life, not a scene from Macbeth.\nFamily and friends all around us worried and sick;\nI know now in my heart it’s a habit I have to kick.\nAsking for help were words I never knew;\nBut breaking my pride was a journey I had to go through.\nInto rehab, not knowing what you expect;\nAll I knew was my head was wrecked.\nThree months of inner work began;\nNot knowing I was about to meet my clan.\nAlways misunderstood and put upon;\nFinally, I was accepted and felt like a swan.\nThey would help me look within;\nSo to help me find my own self.\nI had built a world around me, which was selfish to the core;\nThis was news to me as I never looked at me before.\nMy lifetime habits and behaviours lead to my perceptions;\nNow it’s time to change with no more deceptions.\nNo more wallowing in self-pity;\nIt’s time to return to the city.\nWith all the tools from rehab at my disposal;\nIt’s time to integrate into the hostel.\nOne day at a time to even an hour at a time;\nIt’s not easy policing my thoughts day in and day out.\nBut it’s better than being sick of being sick, of that I have no doubt.",
             audio: "audio/inside Job.m4a" },
            { image: "images/Maninthemirror.jpg",
             text: "The Man in the Mirror\n\n\nI’m gonna make a change for once in my life. It’s gonna feel real good it’s gonna make a difference. I’m starting with the man in the mirror, I’m asking him to change his ways. If you want the world to be a better place, a more fulfilling life take a good look at yourself and make that change”.\n\n\nI look at my behaviours and how they deeply affected those around me; in relationships, with work colleagues and generally how I conducted my day-to-day living.\n\n\nI linked alcohol, drugs and gambling to those behaviours. While topping up my addictions give me a form of escape from reality. A reality formed at a young age through self-belief, thoughts of not living up to other peoples or family standards. Looking around me at 10 or 11 years old and comparing myself to others including cousins and friends.\n\n\nA warped way of thinking at such a young age, the formative years and carrying it through to adulthood. A made up persona to conform to the world around me. A world at my core I hated. I built this persona, especially in high school so that I was not disliked or bullied. I was always in a fight or fighting mood. Always on the front foot, battle ready. I done some bad things on the spur of the moment and lived to regret them.\n\n\nThat regret and shame was like a tug of war in my head, the good side always fighting the bad side. In those years my mental health struggled. Alcohol so young was like fuel to the fire. The behaviours were out of control.", 
             audio: "audio/man mirror.m4a" },
            { image: "images/Themask.jpg",
             text: "Remove The Mask Fill The Void\n\n\nBehind every mask the shadow of addiction lurks;\n\nthe smiling mask that we show to the world has sinister underlying issues underneath.\n\nThe confident mask that hides our fear.\n\nThe false personas that hide our pain, our true selves and shame.\n\nRemove the masks one by one to find a real, imperfect self.\n\nThrough honest acceptance and connections.\n\nNo more using masks as a defence mechanism to hide our vulnerability.\n\nRemove the mask and find the original you.",
             audio: "audio/mask.m4a" },
            { image: "images/Outwithfriends.jpg",
             text: "Sick As Your Secret\n\nWe are only as sick as our secrets.\nWhen buried inside of us, our secrets can cause bitter and twisted perceptions.\nI personally didn’t like what I was witnessing around me growing up, so I fabricated a world of make believe.\n\nLoneliness and isolation wasn’t long to follow.\nTrips to psychologists was the normal - my childhood, adolescence and adult lives consisted of this.\n\nMy mind and thoughts were dark and delusional.\nFrequent outbursts and out of character episodes came along. Emotionally disabled, I tried to carry on but relationships faltered and fell away after some years. No one got me, I didn’t feel good enough.\n\nThen began the outside validation. Anyone or group that showed interest I latched onto, especially if drink or drugs were involved.\nDrink would calm my thoughts. I felt in control of me when drunk. Drugs would soothe my feelings. This began my 40 year love affair with alcohol and drugs. In this time my life became unmanageable.\n\nNow looking back, being 17 months clean, I could cringe. Today my perceptions have changed. Change, what a beautiful word. Without change I would be back on that merry-go round of madness, thinking the world was against me.",
             audio: "audio/sick as your secret.m4a" },
            { image: "images/Curtains.jpg",
             text: "Middletown Dreams\n\n\n\nThe family visit closed early\nThe hidden bottle came out\nI turned to close the blinds\nA little slow now, a little start.\n\n\nBut he’s heading down those tracks\nAny time now for sure\nAnother day as drab as today\nIt’s more than a man can endure.\n\n\nDreams flow across the heartland\nFeeding on the fires\nDreams transport desires\nDrive you when you’re down\nDreams transport the ones\nWho need to get out of town",
             audio: "audio/middletown dreams.m4a" },
            { image: "images/Mybench.jpg",
             text: "My Bench\n\n\nYes that’s my bench, its where I lay my head,\nit’s not very comfortable but to me it’s bed.\nIt’s not the prettiest my bench, paint cracked and rusted through,\n sure I’ll not be here long so for now it will do.\n\n\nI lay here some nights staring at the stars,\n counting the months I’ve been here, I used to count just the hours.\nEvery morning the people come and take my bench away,\n they sit there with their coffee while the children go and play.\n\n\nIt’s then I hide out of site so no-one knows my fate,\ncounting down the hours till the ward locks the gate.\nThat’s when I get my bench back, my bed for the night,\nthough most nights I just lie awake yearning for daylight.\n\n\nThere’s nights I do sleep and dream here in the park,\nI dream to no longer be afraid hiding in the dark.\nYes that’s my bench, it’s where I lay my head,\nI’m not asking for much, I just want my own bed.",
             audio: "audio/my bench.m4a" },
            { image: "images/Locked.jpg",
             text: "Addiction — Flip The Mindset\n\n\nDon’t look back with anger, look at the part you played. Don’t look back at the episodes and search for someone to blame. Don’t entertain those childish perceptions as they are only made up. Come away from those playground antics - these outrageous behaviours from adolescence must be left behind.\n\n\nThe world we built in our mind must be dismantled. The walls we built for our own protection must come down. Free our minds of addiction or it’s a lifetime of contradiction. “He did this”, “she did that” has to go. Common ground has to be found or in this world you will surely drown. Learn to forgive oneself or we will end up on the shelf. We must fix steps to let go or past pain will only grow.\n\n\nPity parties must ebb away or one day out you go with nowhere to stay. You have to go within to flow out of your trauma or you’re in for a life of drama. Ask for help to break that pride or you’ll be in for a rough ride. Say cheerio to our ego for not everything has to be known. Trust the process and believe me, it’s great without the stress.",
             audio: "audio/flip the mindset.m4a" },
            { image: "images/Keepfit.jpg",
            text: "Hopeless To A Miracle\n\n\nMy journey out of hell came at a great cost. It was a cost I dreaded, but for my departure this bill was due.\n\nThe comfort of drugs and alcohol - I gave full submission. From there I drowned in debt and horrific addiction.\n\nFrom the weight of the world on my shoulders and crying my last tear, God gave me a listening ear.\n\nTo a homeless drunk, a reason to live - a solution to my problem, I became a marathon man.\n\nFrom having nothing to having my own home, from hating to becoming a loving man, I am certain God’s got a new plan.",
            audio: "audio/marathon man.m4a" },
            { image: "images/stormont.jpg",
             text: "Naked Shame\n\n\n\nThe word homeless lands in rooms like a fist.\n\n“It’s only for a bit.” — a lie worn like a jersey that doesn’t fit.\n\n“His own fault,” they murmur with soft, comfortable cruelty.\n\nAnd I carry that whisper like a stone in my coat.\n\nI dress in clothes that’ve been donated with good intentions. Each seam says: not yours. Each tag says: someone else’s past.\n\nHear me properly: I am ashamed and I am furious.\n\nI am ashamed that I must ask, and furious that I must beg.\n\nIf my head bursts from the pressure, let the pieces spell out the names of the people who walked past, the policies that failed, the hands that closed.\n\nAnger that remembers names of councillors who promised, then vanished.\n\nI am Sean Kane.\n\nSofa-surfed, doorstep-slept, paper-checked, system-f**ked, still standing. \n\nI am tired, but not finished — not by a long shot.",
             audio: "audio/Sean Kane.m4a" },
            { image: "images/Hope.jpg",
             text: "People Of The Best Kind\n\n\n\nGot a call from a hostel, turns out they had a room;\nGood news for this desperate homeless man you would think but for me, I feared more gloom.\n\nI had lost my mom, I lost my home, I damn near lost my mind;\nNow I would be surrounded by Drunks and Junkies, the people of the worst kind.\n\nI got to the room I was given, soon there was a loud knock on my door;\nTurns out the fella across from me had spare food, and asked if I needed more.\n\nSoon I was given and old phone, some tobacco and even an old tv;\nThey invited me for walks and talks and all their kindness and advice of course was all for free.\n\nTurns out the drunks and junkies, and people of the worst kind;\nWere just trying to make it through another day and making sure to help me get through mine.\n\nI sit here now in a wee house that is mine;\nCupboards stacked, heating on and more happiness I couldn’t find.\n\nI can’t help but smile now as I look back to when I nearly lost my mind;\nTo know how lucky I was in my darkest day, to be saved by people of the best kind.",
             audio: "audio/best people.m4a" }
        ];

        // ==========================================

        // ==========================================
        // 3. ENVIRONMENT & ROOM JPG TEXTURE SYSTEM

        const roomSize = 40;
        const wallHeight = 10;
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        /**
         * Helper to load and configure any .jpg texture with tiling repeat & sRGB color
         */
        function loadTiledJpg(url, repeatX, repeatY, onSuccess, onError) {
            const tex = textureLoader.load(
                url,
                (loadedTex) => {
                    loadedTex.wrapS = THREE.RepeatWrapping;
                    loadedTex.wrapT = THREE.RepeatWrapping;
                    loadedTex.repeat.set(repeatX, repeatY);
                    loadedTex.colorSpace = THREE.SRGBColorSpace;
                    loadedTex.needsUpdate = true;
                    if (onSuccess) onSuccess(loadedTex);
                },
                undefined,
                (err) => {
                    if (onError) onError(err);
                }
            );
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeatX, repeatY);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // 1. Floor Mesh & JPG Texture
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            roughness: 0.75,

            color: 0xffffff,

            metalness: 0.05
        });
        const ceilingGeo = new THREE.PlaneGeometry(roomSize, roomSize);
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = wallHeight;
        scene.add(ceiling);

        // 3. Outer Gallery Walls (Top & Bottom faces disabled so Floor & Ceiling planes show cleanly!)
        const wallTexture = loadTiledJpg(ROOM_TEXTURES.wallJpg, ROOM_TEXTURES.wallRepeat.x, ROOM_TEXTURES.wallRepeat.y);
        const wallSideMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture, 
            side: THREE.BackSide,
            roughness: 0.88
        });
        const hiddenCapMat = new THREE.MeshBasicMaterial({ visible: false });
        const roomGeo = new THREE.BoxGeometry(roomSize, wallHeight, roomSize);
        // BoxGeometry material order: [Right, Left, Top, Bottom, Front, Back]
        const roomMaterials = [
            wallSideMat,  // East wall
            wallSideMat,  // West wall
            hiddenCapMat, // Top cap disabled (uses dedicated ceiling mesh)
            hiddenCapMat, // Bottom cap disabled (uses dedicated floor mesh)
            wallSideMat,  // South wall

        ];
        const roomMesh = new THREE.Mesh(roomGeo, roomMaterials);

        // Public functions to change Floor or Ceiling JPG at any time
        function setFloorTextureJpg(jpgUrl, repeatX = ROOM_TEXTURES.floorRepeat.x, repeatY = ROOM_TEXTURES.floorRepeat.y) {

        function setCeilingTextureJpg(jpgUrl, repeatX = ROOM_TEXTURES.ceilingRepeat.x, repeatY = ROOM_TEXTURES.ceilingRepeat.y) {

                },
                () => {

                    ceilingMat.map = null;

        // Load initial Floor and Ceiling JPGs from ROOM_TEXTURES config
        setFloorTextureJpg(ROOM_TEXTURES.floorJpg, ROOM_TEXTURES.floorRepeat.x, ROOM_TEXTURES.floorRepeat.y);
        setCeilingTextureJpg(ROOM_TEXTURES.ceilingJpg, ROOM_TEXTURES.ceilingRepeat.x, ROOM_TEXTURES.ceilingRepeat.y);

        // Web Asset: Rich Hardwood Grain from Official Three.js CDN for Museum Frames & Benches
        const woodTexture = textureLoader.load('https://threejs.org/examples/textures/hardwood2_diffuse.jpg');
        woodTexture.wrapS = THREE.RepeatWrapping;

        const woodRoughness = textureLoader.load('https://threejs.org/examples/textures/hardwood2_roughness.jpg');

        woodRoughness.wrapT = THREE.RepeatWrapping;

        // ==========================================
        // 4. MUSEUM FRAME, AUTO-FIT PLAQUE & 3D AUDIO BUTTON
        // ==========================================
        const darkWalnutMat = new THREE.MeshStandardMaterial({
            map: woodTexture,
            roughnessMap: woodRoughness,
            color: 0x6e472b,
            roughness: 0.45,

        const brushedGoldMat = new THREE.MeshStandardMaterial({
            color: 0xd4af37,

        function createOrnateArtworkFrame(imageUrl) {
            const frameGroup = new THREE.Group();
            const artWidth = 2.85;
            const artHeight = 2.85;
            const matMargin = 0.26;
            const outerWidth = artWidth + matMargin * 2;
            const outerHeight = artHeight + matMargin * 2;
            const mouldingWidth = 0.22;
            const mouldingDepth = 0.16;

            const matboardGeo = new THREE.BoxGeometry(outerWidth, outerHeight, 0.04);
            const matboardMesh = new THREE.Mesh(matboardGeo, creamMatboardMat);
            matboardMesh.position.z = 0.02;
            frameGroup.add(matboardMesh);

            const topBottomGeo = new THREE.BoxGeometry(outerWidth + mouldingWidth * 2, mouldingWidth, mouldingDepth);
            const leftRightGeo = new THREE.BoxGeometry(mouldingWidth, outerHeight, mouldingDepth);

            const topBar = new THREE.Mesh(topBottomGeo, darkWalnutMat);
            topBar.position.set(0, outerHeight / 2 + mouldingWidth / 2, mouldingDepth / 2);
            frameGroup.add(topBar);

            const bottomBar = new THREE.Mesh(topBottomGeo, darkWalnutMat);
            bottomBar.position.set(0, -outerHeight / 2 - mouldingWidth / 2, mouldingDepth / 2);
            frameGroup.add(bottomBar);

            const leftBar = new THREE.Mesh(leftRightGeo, darkWalnutMat);
            leftBar.position.set(-outerWidth / 2 - mouldingWidth / 2, 0, mouldingDepth / 2);
            frameGroup.add(leftBar);

            const rightBar = new THREE.Mesh(leftRightGeo, darkWalnutMat);
            rightBar.position.set(outerWidth / 2 + mouldingWidth / 2, 0, mouldingDepth / 2);
            frameGroup.add(rightBar);

            const lipThickness = 0.045;
            const lipDepth = 0.11;
            const hLipGeo = new THREE.BoxGeometry(outerWidth + lipThickness * 2, lipThickness, lipDepth);
            const vLipGeo = new THREE.BoxGeometry(lipThickness, outerHeight, lipDepth);

            const topLip = new THREE.Mesh(hLipGeo, brushedGoldMat);
            topLip.position.set(0, outerHeight / 2 + lipThickness / 2, lipDepth / 2);
            frameGroup.add(topLip);

            const bottomLip = new THREE.Mesh(hLipGeo, brushedGoldMat);
            bottomLip.position.set(0, -outerHeight / 2 - lipThickness / 2, lipDepth / 2);
            frameGroup.add(bottomLip);

            const leftLip = new THREE.Mesh(vLipGeo, brushedGoldMat);
            leftLip.position.set(-outerWidth / 2 - lipThickness / 2, 0, lipDepth / 2);
            frameGroup.add(leftLip);

            const rightLip = new THREE.Mesh(vLipGeo, brushedGoldMat);
            rightLip.position.set(outerWidth / 2 + lipThickness / 2, 0, lipDepth / 2);
            frameGroup.add(rightLip);

            const innerLipSize = 0.03;
            const innerHGeo = new THREE.BoxGeometry(artWidth + innerLipSize * 2, innerLipSize, 0.06);
            const innerVGeo = new THREE.BoxGeometry(innerLipSize, artHeight, 0.06);

            const iTop = new THREE.Mesh(innerHGeo, brushedGoldMat);
            iTop.position.set(0, artHeight / 2 + innerLipSize / 2, 0.035);
            frameGroup.add(iTop);

            const iBottom = new THREE.Mesh(innerHGeo, brushedGoldMat);
            iBottom.position.set(0, -artHeight / 2 - innerLipSize / 2, 0.035);
            frameGroup.add(iBottom);

            const iLeft = new THREE.Mesh(innerVGeo, brushedGoldMat);
            iLeft.position.set(-artWidth / 2 - innerLipSize / 2, 0, 0.035);
            frameGroup.add(iLeft);

            const iRight = new THREE.Mesh(innerVGeo, brushedGoldMat);
            iRight.position.set(artWidth / 2 + innerLipSize / 2, 0, 0.035);
            frameGroup.add(iRight);

            const cornerGeo = new THREE.BoxGeometry(mouldingWidth * 1.05, mouldingWidth * 1.05, mouldingDepth + 0.02);
            const cornerOffset = outerWidth / 2 + mouldingWidth / 2;
            [
                [-cornerOffset, cornerOffset],
                [cornerOffset, cornerOffset],
                [-cornerOffset, -cornerOffset],
                [cornerOffset, -cornerOffset]
            ].forEach(([cx, cy]) => {
                const cornerMesh = new THREE.Mesh(cornerGeo, brushedGoldMat);
                cornerMesh.position.set(cx, cy, (mouldingDepth + 0.02) / 2);
                frameGroup.add(cornerMesh);
            });

            const artTex = textureLoader.load(imageUrl);
            artTex.colorSpace = THREE.SRGBColorSpace;
            const artGeo = new THREE.PlaneGeometry(artWidth, artHeight);
            const artMat = new THREE.MeshBasicMaterial({ map: artTex });
            const artMesh = new THREE.Mesh(artGeo, artMat);
            artMesh.position.z = 0.052;
            frameGroup.add(artMesh);

            const lampY = outerHeight / 2 + mouldingWidth + 0.22;
            const armGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.45, 12);
            const armMesh = new THREE.Mesh(armGeo, brushedGoldMat);
            armMesh.rotation.x = Math.PI / 2;
            armMesh.position.set(0, lampY, 0.22);
            frameGroup.add(armMesh);

            const hoodGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.95, 16);
            const hoodMesh = new THREE.Mesh(hoodGeo, brushedGoldMat);
            hoodMesh.rotation.z = Math.PI / 2;
            hoodMesh.position.set(0, lampY, 0.45);
            frameGroup.add(hoodMesh);

            const bulbGeo = new THREE.PlaneGeometry(0.85, 0.08);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff3cc, side: THREE.DoubleSide });
            const bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
            bulbMesh.rotation.x = Math.PI / 2;
            bulbMesh.position.set(0, lampY - 0.05, 0.45);
            frameGroup.add(bulbMesh);

            return frameGroup;
        }

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1360;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#1c1b20');
            grad.addColorStop(1, '#121115');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 8;
            ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);

            ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
            ctx.lineWidth = 2;
            ctx.strokeRect(38, 38, canvas.width - 76, canvas.height - 76);

            const normalizedText = text.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
            const rawLines = normalizedText.split('\n');
            const titleText = rawLines[0].trim();
            const bodyRawLines = rawLines.slice(1);

            const paddingX = 68;
            const maxWidth = canvas.width - paddingX * 2;
            const topMargin = 86;
            const bottomLimit = canvas.height - 64;

            function wrapLine(str) {
                const words = str.split(/\s+/);
                const lines = [];
                let current = '';
                for (let n = 0; n < words.length; n++) {
                    const testLine = current ? current + ' ' + words[n] : words[n];
                    if (ctx.measureText(testLine).width > maxWidth && current) {
                        lines.push(current);
                        current = words[n];
                    } else {
                        current = testLine;
                    }
                }
                if (current) lines.push(current);
                return lines;
            }

            let bodyFontSize = 27;
            let titleFontSize = 38;
            let lineHeight = 36;
            let emptyLineGap = 16;
            let paraSpacing = 6;
            let wrappedTitle = [];
            let renderBlocks = [];
            let totalContentHeight = 0;

            while (bodyFontSize >= 15) {
                titleFontSize = Math.max(26, Math.round(bodyFontSize * 1.38));
                lineHeight = Math.round(bodyFontSize * 1.34);
                emptyLineGap = Math.max(8, Math.round(bodyFontSize * 0.55));
                paraSpacing = Math.max(3, Math.round(bodyFontSize * 0.2));

                ctx.font = `bold ${titleFontSize}px "Cinzel", Georgia, serif`;
                wrappedTitle = wrapLine(titleText);
                const titleBlockHeight = wrappedTitle.length * (titleFontSize * 1.22) + 38;

                ctx.font = `${bodyFontSize}px "Plus Jakarta Sans", sans-serif`;
                renderBlocks = [];
                let bodyHeight = 0;
                let prevWasEmpty = false;

                for (let i = 0; i < bodyRawLines.length; i++) {
                    const clean = bodyRawLines[i].trim();
                    if (!clean) {
                        if (!prevWasEmpty && renderBlocks.length > 0) {
                            renderBlocks.push({ type: 'gap', height: emptyLineGap });
                            bodyHeight += emptyLineGap;
                        }
                        prevWasEmpty = true;
                    } else {
                        prevWasEmpty = false;
                        const wLines = wrapLine(clean);
                        const h = wLines.length * lineHeight + paraSpacing;
                        renderBlocks.push({ type: 'lines', lines: wLines, height: h });
                        bodyHeight += h;
                    }
                }

                totalContentHeight = titleBlockHeight + bodyHeight;
                if (topMargin + totalContentHeight <= bottomLimit) {
                    break;
                }
                bodyFontSize -= 1;
            }

            const availableHeight = bottomLimit - topMargin;
            const extraSpace = Math.max(0, availableHeight - totalContentHeight);
            let y = topMargin + Math.min(50, extraSpace * 0.3);

            ctx.font = `bold ${titleFontSize}px "Cinzel", Georgia, serif`;
            ctx.fillStyle = '#f5d78e';
            wrappedTitle.forEach((tLine) => {
                ctx.fillText(tLine, paddingX, y);
                y += Math.round(titleFontSize * 1.22);
            });

            y -= Math.round(titleFontSize * 0.25);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(paddingX, y);
            ctx.lineTo(paddingX + 260, y);
            ctx.stroke();
            y += Math.round(lineHeight * 1.05);

            ctx.font = `${bodyFontSize}px "Plus Jakarta Sans", sans-serif`;
            ctx.fillStyle = '#e8e6e3';

            renderBlocks.forEach((block) => {
                if (block.type === 'gap') {
                    y += block.height;
                } else {
                    block.lines.forEach((ln) => {
                        ctx.fillText(ln, paddingX, y);
                        y += lineHeight;
                    });
                    y += paraSpacing;
                }
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.needsUpdate = true;
            return texture;
        }

        function create3DAudioButtonTexture(isPlaying) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            if (isPlaying) {
                grad.addColorStop(0, '#d4af37');
                grad.addColorStop(1, '#f5d78e');
            } else {
                grad.addColorStop(0, '#1f1e24');
                grad.addColorStop(1, '#2b2933');
            }

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 56);
            ctx.fill();

            ctx.lineWidth = 5;
            ctx.strokeStyle = isPlaying ? '#ffffff' : '#d4af37';
            ctx.stroke();

            ctx.fillStyle = isPlaying ? '#151519' : '#d4af37';
            ctx.beginPath();
            ctx.arc(68, 64, 36, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = isPlaying ? '#f5d78e' : '#151519';
            if (isPlaying) {
                ctx.fillRect(55, 48, 9, 32);
                ctx.fillRect(72, 48, 9, 32);
            } else {
                ctx.beginPath();
                ctx.moveTo(59, 46);
                ctx.lineTo(85, 64);
                ctx.lineTo(59, 82);
                ctx.closePath();
                ctx.fill();
            }

            ctx.font = 'bold 28px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = isPlaying ? '#151519' : '#f5d78e';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(isPlaying ? 'PLAYING STORY...' : 'LISTEN TO STORY', 124, 65);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const btnTexIdle = create3DAudioButtonTexture(false);
        const btnTexPlaying = create3DAudioButtonTexture(true);

        // ==========================================
        // 5. PLACE ARTWORKS, PLAQUES & 3D AUDIO BUTTONS

        const exhibitStations = [];
        const interactiveButtons = [];

        const wallDistribution = [
            { count: 4, wall: 'north' },
            { count: 3, wall: 'east'  },
            { count: 4, wall: 'south' },
            { count: 3, wall: 'west'  }
        ];

        let itemIndex = 0;
        const wallOffset = (roomSize / 2) - 0.15;

        wallDistribution.forEach(({ count, wall }) => {
            for (let i = 0; i < count; i++) {
                if (itemIndex >= galleryItems.length) break;
                const item = galleryItems[itemIndex];

                const stationGroup = new THREE.Group();
                const spread = roomSize - 8;
                const offsetAlongWall = -spread / 2 + (i + 0.5) * (spread / count);

                if (wall === 'north') {
                    stationGroup.position.set(offsetAlongWall, 3.3, -wallOffset);
                    stationGroup.rotation.y = 0;
                } else if (wall === 'east') {
                    stationGroup.position.set(wallOffset, 3.3, offsetAlongWall);
                    stationGroup.rotation.y = -Math.PI / 2;
                } else if (wall === 'south') {
                    stationGroup.position.set(-offsetAlongWall, 3.3, wallOffset);
                    stationGroup.rotation.y = Math.PI;
                } else if (wall === 'west') {
                    stationGroup.position.set(-wallOffset, 3.3, -offsetAlongWall);
                    stationGroup.rotation.y = Math.PI / 2;

        function createGalleryBench() {
            const bench = new THREE.Group();
            const length = 3.6;
            const depth = 1.25;

            const baseGeo = new THREE.BoxGeometry(length, 0.12, depth);
            const baseMesh = new THREE.Mesh(baseGeo, darkWalnutMat);

            for (let i = -2; i <= 2; i++) {

                seam.position.set(xPos, 0.57, 0);

                [-0.28, 0.28].forEach((zPos) => {

                    btn.position.set(xPos, 0.66, zPos);
                    bench.add(btn);

            const bolsterGeo = new THREE.CylinderGeometry(0.14, 0.14, length - 0.5, 20);
            const bolster = new THREE.Mesh(bolsterGeo, leatherMat);
            bolster.rotation.z = Math.PI / 2;
            bolster.position.y = 0.88;
            bench.add(bolster);

            [-1.1, 0, 1.1].forEach((postX) => {

        function createDecorativePlant(scaleMultiplier = 1.0) {
            const plantGroup = new THREE.Group();

            const potGeo = new THREE.CylinderGeometry(0.56, 0.38, 0.92, 24);
            const potMesh = new THREE.Mesh(potGeo, darkPlanterMat);
            potMesh.position.y = 0.46;
            plantGroup.add(potMesh);

            const rimGeo = new THREE.TorusGeometry(0.56, 0.032, 12, 32);
            const rimMesh = new THREE.Mesh(rimGeo, brushedGoldMat);
            rimMesh.rotation.x = Math.PI / 2;
            rimMesh.position.y = 0.92;
            plantGroup.add(rimMesh);

            const soilGeo = new THREE.CylinderGeometry(0.53, 0.53, 0.04, 20);
            const soilMesh = new THREE.Mesh(soilGeo, soilMat);
            soilMesh.position.y = 0.89;
            plantGroup.add(soilMesh);

            for (let s = 0; s < 3; s++) {
                const stemH = 0.85 + s * 0.22;
                const stemGeo = new THREE.CylinderGeometry(0.03, 0.05, stemH, 10);
                const stem = new THREE.Mesh(stemGeo, darkWalnutMat);
                stem.position.set((s - 1) * 0.08, 0.9 + stemH / 2, (s % 2 === 0 ? 0.05 : -0.05));
                stem.rotation.z = (s - 1) * 0.08;
                plantGroup.add(stem);
            }

            const tiers = [
                { count: 7, height: 1.15, tilt: 0.82, len: 1.05, width: 0.34, mat: leafMat },
                { count: 6, height: 1.45, tilt: 0.55, len: 0.95, width: 0.30, mat: leafLightMat },
                { count: 5, height: 1.72, tilt: 0.28, len: 0.78, width: 0.25, mat: leafLightMat }
            ];

            tiers.forEach((tier, tIdx) => {
                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const frondPivot = new THREE.Group();
                    frondPivot.position.set(0, tier.height, 0);
                    frondPivot.rotation.y = angle;
                    frondPivot.rotation.x = tier.tilt;

                    const segLen = tier.len / 3;
                    let segParent = frondPivot;

                    for (let seg = 0; seg < 3; seg++) {
                        const segWidth = tier.width * (1 - seg * 0.25);
                        const bladeGeo = new THREE.PlaneGeometry(segWidth, segLen);
                        bladeGeo.translate(0, segLen / 2, 0);

                        const bladeMesh = new THREE.Mesh(bladeGeo, tier.mat);
                        if (seg > 0) {
                            bladeMesh.position.y = segLen;
                            bladeMesh.rotation.x = 0.26;
                        }
                        segParent.add(bladeMesh);
                        segParent = bladeMesh;
                    }

                    plantGroup.add(frondPivot);
                }
            });

            plantGroup.scale.setScalar(scaleMultiplier);
            return plantGroup;
        }

        const benchLocations = [

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            if (bgmEnabled) {
                bgMusic.play().catch(() => {});
            }
        }

        function syncAudioUI() {
            exhibitStations.forEach((st) => {
                const isThisPlaying = (st === activeStation && !st.audio.paused);
                st.btnMesh.material.map = isThisPlaying ? btnTexPlaying : btnTexIdle;
                st.btnMesh.material.needsUpdate = true;
            });

            if (!activeStation) {
                btnPlayToggle.disabled = true;
                audioHud.classList.remove('playing');
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                hudTrackTitle.textContent = 'Walk near an artwork...';
                progressFill.style.width = '0%';
                timeCurrent.textContent = '0:00';
                timeTotal.textContent = '0:00';
                if (bgmEnabled) bgMusic.volume = 0.25;
                return;
            }

            btnPlayToggle.disabled = false;
            hudTrackTitle.textContent = activeStation.title;
            const isPlaying = !activeStation.audio.paused;

            if (isPlaying) {
                audioHud.classList.add('playing');
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                if (bgmEnabled) bgMusic.volume = 0.06;
            } else {
                audioHud.classList.remove('playing');
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                if (bgmEnabled) bgMusic.volume = 0.20;
            }
        }

        function toggleStationAudio(station) {
            unlockAudio();
            if (!station) return;

            if (activeStation && activeStation !== station) {
                activeStation.audio.pause();
                activeStation.audio.currentTime = 0;
                activeStation.manuallyPaused = false;
            }

            activeStation = station;

            if (station.audio.paused) {
                station.manuallyPaused = false;
                station.audio.play().then(syncAudioUI).catch((err) => {
                    console.warn("Audio playback issue:", err);
                });
            } else {
                station.manuallyPaused = true;
                station.audio.pause();
                syncAudioUI();
            }
        }

        exhibitStations.forEach((st) => {
            st.audio.addEventListener('timeupdate', () => {
                if (st === activeStation) {
                    const cur = st.audio.currentTime;
                    const dur = st.audio.duration || 0;
                    timeCurrent.textContent = formatTime(cur);
                    timeTotal.textContent = formatTime(dur);
                    progressFill.style.width = dur > 0 ? `${(cur / dur) * 100}%` : '0%';
                }
            });
            st.audio.addEventListener('ended', () => {
                st.manuallyPaused = true;
                syncAudioUI();
            });
            st.audio.addEventListener('play', syncAudioUI);
            st.audio.addEventListener('pause', syncAudioUI);
        });

        btnPlayToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activeStation) toggleStationAudio(activeStation);
        });

        btnRestart.addEventListener('click', (e) => {
            e.stopPropagation();
            unlockAudio();
            if (activeStation) {
                activeStation.audio.currentTime = 0;
                activeStation.manuallyPaused = false;
                activeStation.audio.play().catch(() => {});
            }
        });

        btnBgm.addEventListener('click', (e) => {
            e.stopPropagation();
            unlockAudio();
            bgmEnabled = !bgmEnabled;
            btnBgm.classList.toggle('active', bgmEnabled);
            if (bgmEnabled) {
                bgMusic.play().catch(() => {});
            } else {
                bgMusic.pause();
            }
        });

        progressTrack.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!activeStation || !activeStation.audio.duration) return;
            const rect = progressTrack.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            activeStation.audio.currentTime = ratio * activeStation.audio.duration;
        });

        function updateProximityAudio() {
            if (!audioUnlocked) return;

            const playerPos = new THREE.Vector3();
            camera.getWorldPosition(playerPos);

            let closestStation = null;
            let minDistance = Infinity;
            const triggerDistance = 5.0;

            for (const station of exhibitStations) {
                const dist = playerPos.distanceTo(station.group.position);
                if (dist < triggerDistance && dist < minDistance) {
                    minDistance = dist;
                    closestStation = station;
                }
            }

            if (closestStation !== activeStation) {
                if (activeStation) {
                    activeStation.audio.pause();
                    activeStation.audio.currentTime = 0;
                    activeStation.manuallyPaused = false;
                }

                activeStation = closestStation;

                if (activeStation && !activeStation.manuallyPaused) {
                    activeStation.audio.play().catch(() => {});
                }
                syncAudioUI();
            }
        }

        // ==========================================
        // 7. CONTROLS & 3D RAYCASTER FOR PLAQUE BUTTONS
        // ==========================================
        const moveState = { forward: false, backward: false, left: false, right: false };
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();

        window.addEventListener('keydown', (e) => {
            unlockAudio();
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = false;
        });

        function bindDpadButton(id, dirKey) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); unlockAudio(); moveState[dirKey] = true; };
            const end = (e) => { e.preventDefault(); moveState[dirKey] = false; };

            btn.addEventListener('pointerdown', start);
            btn.addEventListener('pointerup', end);
            btn.addEventListener('pointerleave', end);
            btn.addEventListener('pointercancel', end);
        }

        bindDpadButton('btn-up', 'forward');
        bindDpadButton('btn-down', 'backward');
        bindDpadButton('btn-left', 'left');
        bindDpadButton('btn-right', 'right');

        let isDragging = false;
        let dragDistance = 0;
        let prevPointer = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            unlockAudio();
            isDragging = true;
            dragDistance = 0;
            prevPointer.x = e.clientX;
            prevPointer.y = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) {
                pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
                pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(pointerNDC, camera);
                const hits = raycaster.intersectObjects(interactiveButtons);
                renderer.domElement.style.cursor = (hits.length > 0 && hits[0].distance < 12) ? 'pointer' : 'grab';
                return;
            }

            if (renderer.xr.isPresenting) return;
            const dx = e.clientX - prevPointer.x;
            const dy = e.clientY - prevPointer.y;
            dragDistance += Math.hypot(dx, dy);
            prevPointer.x = e.clientX;
            prevPointer.y = e.clientY;

            playerRig.rotation.y -= dx * 0.004;
            camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camera.rotation.x - dy * 0.004));
        });

        window.addEventListener('pointerup', (e) => {
            if (isDragging && dragDistance < 8 && e.target === renderer.domElement) {
                pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
                pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(pointerNDC, camera);
                const hits = raycaster.intersectObjects(interactiveButtons);
                if (hits.length > 0 && hits[0].distance < 12) {
                    const clickedStation = hits[0].object.userData.station;
                    toggleStationAudio(clickedStation);
                }
            }
            isDragging = false;
        });

        // ==========================================
        // 8. ANIMATION LOOP, COLLISIONS & RESIZE
        // ==========================================
        const clock = new THREE.Clock();
        const moveSpeed = 5.0;
        const turnSpeed = 1.6;
        const boundaryLimit = (roomSize / 2) - 1.6;

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            sculptureGroup.rotation.y = elapsed * 0.35;
            sculptureGroup.position.y = 2.25 + Math.sin(elapsed * 1.5) * 0.06;

            if (moveState.left) playerRig.rotation.y += turnSpeed * delta;
            if (moveState.right) playerRig.rotation.y -= turnSpeed * delta;

            if (moveState.forward || moveState.backward) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                const sign = moveState.forward ? 1 : -1;
                playerRig.position.addScaledVector(dir, sign * moveSpeed * delta);

                playerRig.position.x = Math.max(-boundaryLimit, Math.min(boundaryLimit, playerRig.position.x));
                playerRig.position.z = Math.max(-boundaryLimit, Math.min(boundaryLimit, playerRig.position.z));

                for (const col of colliders) {
                    const dx = playerRig.position.x - col.x;
                    const dz = playerRig.position.z - col.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist < col.radius && dist > 0.001) {
                        const overlap = col.radius - dist;
                        playerRig.position.x += (dx / dist) * overlap;
                        playerRig.position.z += (dz / dist) * overlap;
                    }
                }
            }

            exhibitStations.forEach((st) => {
                if (st === activeStation && !st.audio.paused) {
                    const pulse = 1 + Math.sin(elapsed * 5) * 0.035;
                    st.btnGroup.scale.set(pulse, pulse, 1);
                } else {
                    st.btnGroup.scale.set(1, 1, 1);
                }
            });

            updateProximityAudio();
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
